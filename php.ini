; Configurazione PHP personalizzata per Railway (Railpack la rileva
; automaticamente perché si chiama php.ini ed è nella root del progetto).
;
; I valori di default sono troppo bassi per caricare un PDF di un libro
; intero dal pannello autore (spesso diversi MB, a volte anche 20-30MB con
; immagini incluse). post_max_size deve sempre essere >= upload_max_filesize,
; altrimenti PHP scarta l'intera richiesta prima ancora di leggerla.
upload_max_filesize = 60M
post_max_size = 65M
memory_limit = 256M
max_execution_time = 60

; In produzione gli avvisi/errori PHP non devono mai finire nell'output:
; se un endpoint come api.php li stampa prima del JSON, il browser non
; riesce più a leggere la risposta (è successo con l'avviso "deprecated"
; di curl_close() su PHP 8.5, e ha rotto il download del libro gratuito).
; Restano comunque registrati nei log di Railway grazie a log_errors.
display_errors = Off
log_errors = On
